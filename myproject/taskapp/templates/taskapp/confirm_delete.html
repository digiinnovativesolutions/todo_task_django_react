<!-- taskapp/templates/taskapp/confirm_delete.html -->

{% extends 'layout.html' %}

{% block content %}
  <h1>Confirm Delete</h1>
  <p>Are you sure you want to delete "{{ task.title }}"?</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit">Confirm</button>
    <a href="{% url 'taskapp:task_list' %}">Cancel</a>
  </form>
{% endblock %}
