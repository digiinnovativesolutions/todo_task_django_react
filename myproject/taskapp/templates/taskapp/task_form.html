{% load widget_tweaks %}

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
      <div class="card shadow-sm">
        <div class="card-header bg-primary text-white text-center">
          <h2 class="mb-0">Create New Task</h2>
        </div>
        <div class="card-body">
          <form method="post">
            {% csrf_token %}
            {% if form.errors %}
              <div class="alert alert-danger">
                {{ form.errors }}
              </div>
            {% endif %}

            <!-- Title: Make readonly for users by adding conditional readonly, keep input name -->
            <div class="mb-4">
              <label class="form-label fw-bold">Title</label>
              <input type="text" class="form-control form-control-lg" name="title" value="{{ task.title|default:'' }}"
                {% if not user.is_superuser and not user.is_staff %}readonly{% endif %} required>
            </div>

            <!-- Description: Make readonly for users -->
            <div class="mb-4">
              <label class="form-label fw-bold">Description</label>
              <textarea class="form-control form-control-lg" rows="4" name="description"
                {% if not user.is_superuser and not user.is_staff %}readonly{% endif %}>{{ task.description|default:'' }}</textarea>
            </div>

            <!-- Assignee: Show dropdown for admin/staff, readonly input for users -->
            {% if user.is_superuser or user.is_staff %}
              <div class="mb-4">
                <label class="form-label fw-bold">Assignee</label>
                <select class="form-select form-select-lg" name="assignee">
                  {% for user_obj in users %}
                    <option value="{{ user_obj.id }}" {% if task.assignee and task.assignee.id == user_obj.id %}selected{% endif %}>{{ user_obj.username }}</option>
                  {% endfor %}
                </select>
              </div>
            {% else %}
              <div class="mb-4">
                <label class="form-label fw-bold">Assignee</label>
                <input type="text" class="form-control form-control-lg" value="{{ task.assignee.username }}" readonly>
              </div>
            {% endif %}

            <!-- Status: Always render from form to show for all users -->
            <div class="mb-4">
              <label class="form-label fw-bold">Status</label>
              {{ form.status|add_class:"form-select form-select-lg" }}
            </div>

            <!-- Remarks: Always render from form for all users -->
            <div class="mb-4">
              <label class="form-label fw-bold">Remarks</label>
              {{ form.remarks|add_class:"form-control form-control-lg" }}
            </div>

            <!-- Start and Due Dates: Make readonly for users -->
            <div class="row mb-4">
              <div class="col">
                <label class="form-label fw-bold">Start Date</label>
                <input type="date" class="form-control form-control-lg" name="start_date" value="{{ task.start_date|default:'' }}"
                  {% if not user.is_superuser and not user.is_staff %}readonly{% endif %}>
              </div>
              <div class="col">
                <label class="form-label fw-bold">Due Date</label>
                <input type="date" class="form-control form-control-lg" name="due_date" value="{{ task.due_date|default:'' }}"
                  {% if not user.is_superuser and not user.is_staff %}readonly{% endif %}>
              </div>
            </div>

            <button type="submit" class="btn btn-success w-100 btn-lg">Save Task</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
