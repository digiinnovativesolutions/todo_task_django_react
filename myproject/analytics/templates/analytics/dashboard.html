{% extends 'layout.html' %}
{% block content %}
  <div class="container mt-4">
    <h1>Analytics Dashboard</h1>
    <div class="row">
      <div class="col-md-3">
        <div class="card">
          <div class="card-body">
            <h5 class="card-title">Total Tasks</h5>
            <p class="card-text">{{ total_tasks }}</p>
          </div>
        </div>
      </div>
      <div class="col-md-3">
        <div class="card">
          <div class="card-body">
            <h5 class="card-title">Completed Tasks</h5>
            <p class="card-text">{{ completed_tasks }}</p>
          </div>
        </div>
      </div>
      <div class="col-md-3">
        <div class="card">
          <div class="card-body">
            <h5 class="card-title">In Progress</h5>
            <p class="card-text">{{ in_progress }}</p>
          </div>
        </div>
      </div>
      <div class="col-md-3">
        <div class="card">
          <div class="card-body">
            <h5 class="card-title">To Do</h5>
            <p class="card-text">{{ to_do }}</p>
          </div>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
